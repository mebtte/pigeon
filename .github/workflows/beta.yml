name: Publish beta image

on:
  push:
    branches: [v0]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  frontend:
    # Use the upstream repository's Docker Hub credentials for beta builds.
    if: github.repository == 'mebtte/pigeon' && github.event.deleted == false
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  binaries:
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: pigeon-linux-x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: pigeon-linux-arm64
    env:
      PIGEON_TARGET: ${{ matrix.target }}
      PIGEON_ASSET: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Build and check the static Linux executable
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "$PIGEON_TARGET"
          rust_env_target="${PIGEON_TARGET//-/_}"
          musl_cc="$(command -v "${PIGEON_TARGET/-unknown/}-gcc" || command -v musl-gcc)"
          # The scratch Docker image needs a binary with the C runtime linked in.
          env "CC_$rust_env_target=$musl_cc" "CARGO_TARGET_${rust_env_target^^}_LINKER=$musl_cc" \
            RUSTFLAGS='-C target-feature=+crt-static' \
            cargo build --manifest-path backend/Cargo.toml --locked --release --target "$PIGEON_TARGET"
          binary="backend/target/$PIGEON_TARGET/release/pigeon"
          program_headers="$(readelf -l "$binary")"
          if grep -Fq INTERP <<< "$program_headers"; then
            echo 'The Linux executable requires a dynamic interpreter.'
            exit 1
          fi
          python3 scripts/smoke_release.py "$binary"
          install -D -m 0555 "$binary" "release/$PIGEON_ASSET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: binaries
    runs-on: ubuntu-24.04
    concurrency:
      group: pigeon-beta-v0
      queue: max
    env:
      IMAGE: mebtte/pigeon:beta.v0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pigeon-linux-*
          path: release
          merge-multiple: true
      - name: Check the v0 branch head
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep a rerun for an older commit from replacing the rolling tag.
          branch_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/v0" --jq .object.sha)"
          if [[ "$branch_sha" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the multi-architecture beta image
        if: steps.branch.outputs.current == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'mebtte' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          bash scripts/stage_docker.sh amd64 arm64
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker buildx create --driver docker-container --use
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --tag "$IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=${IMAGE##*:}" .
          docker buildx imagetools inspect --raw "$IMAGE" | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | sort == ["amd64", "arm64"]
          '
      # The Docker Hub repository overview is shared by the stable and beta tags.
      - name: Update Docker Hub overview
        if: steps.branch.outputs.current == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME || 'mebtte' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: mebtte/pigeon
          readme-filepath: ./docker/docker.md

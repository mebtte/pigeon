name: CI and release

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  frontend:
    # Pull requests use the base repository. Tag pushes can also move or delete a tag.
    if: github.repository == 'mebtte/pigeon' && (github.ref_type != 'tag' || github.event.created)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run test --if-present
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error

  backend:
    needs: frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - run: cargo fmt --all --check
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 ../scripts/smoke_release.py target/debug/pigeon

  binaries:
    if: github.ref_type == 'tag' && github.event.created
    needs: frontend
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            asset: pigeon-macos-arm64
            python: python3
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            asset: pigeon-windows-x86_64.exe
            python: python
            extension: .exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: pigeon-windows-arm64.exe
            python: python
            extension: .exe
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            asset: pigeon-linux-x86_64
            python: python3
            docker_arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: pigeon-linux-arm64
            python: python3
            docker_arch: arm64
    env:
      PIGEON_TARGET: ${{ matrix.target }}
      PIGEON_ASSET: ${{ matrix.asset }}
      PIGEON_EXTENSION: ${{ matrix.extension }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist
      - run: rustup target add "$PIGEON_TARGET"
      - name: Install the native musl toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rust_env_target="${PIGEON_TARGET//-/_}"
          musl_cc="$(command -v "${PIGEON_TARGET/-unknown/}-gcc" || command -v musl-gcc)"
          {
            printf 'CC_%s=%s\n' "$rust_env_target" "$musl_cc"
            printf 'CARGO_TARGET_%s_LINKER=%s\n' "${rust_env_target^^}" "$musl_cc"
          } >> "$GITHUB_ENV"
      - name: Link the C runtime into the executable
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Build and check the standalone executable
        run: |
          cargo build --manifest-path backend/Cargo.toml --locked --release --target "$PIGEON_TARGET"
          binary="backend/target/$PIGEON_TARGET/release/pigeon$PIGEON_EXTENSION"
          ${{ matrix.python }} scripts/smoke_release.py "$binary"
          mkdir -p release
          cp "$binary" "release/$PIGEON_ASSET"
      - name: Smoke test the native Docker image
        if: runner.os == 'Linux'
        env:
          PIGEON_DOCKER_ARCH: ${{ matrix.docker_arch }}
        run: |
          if readelf -l "release/$PIGEON_ASSET" | grep -Fq INTERP; then
            echo 'The Linux executable requires a dynamic interpreter.'
            exit 1
          fi
          bash scripts/stage_docker.sh "$PIGEON_DOCKER_ARCH"
          docker buildx build --load --platform "linux/$PIGEON_DOCKER_ARCH" --tag pigeon-smoke .
          smoke_image() (
            container="$(docker run --detach --rm --publish 127.0.0.1::3000 "$@" \
              pigeon-smoke serve --data /data --base-path /pigeon --user smoke:smoke-password)"
            trap 'docker stop "$container" >/dev/null 2>&1 || true' EXIT
            address="$(docker port "$container" 3000/tcp)"
            python3 scripts/smoke_release.py --url "http://$address"
          )

          smoke_image

          # A bind mount keeps host permissions instead of using the image's /data.
          bind_data="$(mktemp -d "$RUNNER_TEMP/pigeon-bind.XXXXXX")"
          sudo chown 0:0 "$bind_data"
          sudo chmod 0700 "$bind_data"
          smoke_image --mount "type=bind,source=$bind_data,target=/data"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: release/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    needs: [backend, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: pigeon-release
      queue: max
    env:
      IMAGE: mebtte/pigeon:v0
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pigeon-*
          path: release
          merge-multiple: true
      - name: Prepare the GitHub release draft
        id: github_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Verify that the remote tag still resolves to the commit that was built.
          tagged_commit="$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$RELEASE_TAG" --jq .sha)"
          if [[ "$tagged_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "Release tag $RELEASE_TAG changed after the workflow started."
            exit 1
          fi
          (cd release && sha256sum pigeon-* > SHA256SUMS)
          # A rerun of a published release must not replace the rolling image.
          if state="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"; then
            if [[ "$state" == false ]]; then
              echo 'pending=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release upload "$RELEASE_TAG" release/pigeon-* release/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" release/pigeon-* release/SHA256SUMS \
              --verify-tag --draft --generate-notes
          fi
          echo 'pending=true' >> "$GITHUB_OUTPUT"
      - name: Publish the multi-architecture image
        if: steps.github_release.outputs.pending == 'true'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'mebtte' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          bash scripts/stage_docker.sh amd64 arm64
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
          docker buildx create --driver docker-container --use
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --tag "$IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" .
          docker buildx imagetools inspect --raw "$IMAGE" | jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | sort == ["amd64", "arm64"]
          '
      - name: Publish the GitHub release
        if: steps.github_release.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false
